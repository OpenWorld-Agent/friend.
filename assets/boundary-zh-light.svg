<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 460" width="1280" height="460" role="img" aria-label="数据边界图：记忆与证据留在你的电脑上；中转只经手密文；模型处理只发往你配置的端点。">
<defs>
  <radialGradient id="halo" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#FF7A70" stop-opacity=".55"/>
    <stop offset=".45" stop-color="#FF7A70" stop-opacity=".18"/>
    <stop offset="1" stop-color="#FF7A70" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset="1" stop-color="#FFFFFF"/>
  </linearGradient>
  <linearGradient id="cardAltGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#F6F8FA"/>
    <stop offset="1" stop-color="#F6F8FA"/>
  </linearGradient>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="180%">
    <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="rgba(31,35,40,.13)" flood-opacity="1"/>
  </filter>
  <filter id="softSm" x="-30%" y="-30%" width="160%" height="180%">
    <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="rgba(31,35,40,.13)" flood-opacity=".8"/>
  </filter></defs>
<style>
  .s{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI Variable Display', 'Segoe UI', 'Helvetica Neue', Arial, 'Microsoft YaHei', 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', sans-serif}
  .m{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', 'Microsoft YaHei', monospace}
  .rise{opacity:0;animation:rise .9s cubic-bezier(.16,.84,.32,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(14px);filter:blur(6px)}to{opacity:1;transform:none;filter:blur(0)}}
  @keyframes breathe{0%,100%{opacity:.45;transform:scale(.96)}50%{opacity:.9;transform:scale(1.05)}}
  @keyframes breathe2{
    0%{opacity:.05;transform:scale(.93);animation-timing-function:cubic-bezier(.66,0,.34,1)}
    18%{opacity:.12;transform:scale(1.03);animation-timing-function:cubic-bezier(.37,0,.63,1)}
    34%{opacity:.07;transform:scale(.99);animation-timing-function:cubic-bezier(.45,0,.55,1)}
    57%{opacity:.15;transform:scale(1.085);animation-timing-function:cubic-bezier(.3,0,.7,1)}
    72%{opacity:.088;transform:scale(1.008);animation-timing-function:cubic-bezier(.6,0,.4,1)}
    88%{opacity:.126;transform:scale(1.052);animation-timing-function:cubic-bezier(.5,0,.5,1)}
    100%{opacity:.05;transform:scale(.93)}
  }
  @keyframes twinkle{0%,100%{opacity:.12}50%{opacity:.5}}
  .tw{animation:twinkle 9s ease-in-out infinite}
  .snr{animation:snr 5.4s cubic-bezier(.16,.84,.32,1) infinite;transform-box:fill-box;transform-origin:center}
  @keyframes snr{0%{transform:scale(.5);opacity:.55}65%{opacity:0}100%{transform:scale(1.6);opacity:0}}
  .swp{animation-timing-function:cubic-bezier(.83,0,.17,1);animation-iteration-count:infinite;opacity:0}
  .march{animation:march 1.65s linear infinite}
  .dp{animation:dotpulse 2.6s ease-in-out infinite}
  @keyframes dotpulse{0%,100%{opacity:.42}50%{opacity:1}}
  @keyframes march{to{stroke-dashoffset:-24}}
  .scan{animation:scan 4s cubic-bezier(.83,0,.17,1) infinite;opacity:0}
  @keyframes scan{0%{transform:translateX(0);opacity:0}8%{opacity:1}88%{opacity:1}100%{transform:translateX(1140px);opacity:0}}
  @media (prefers-reduced-motion: reduce){
    .rise{animation:none!important;opacity:1!important;filter:none!important;transform:none!important}
    .tw{animation:none!important;opacity:.55!important}
    .snr,.swp,.scan{animation:none!important;opacity:0!important}
    .march{animation:none!important}
    .dp{animation:none!important;opacity:1!important}
  }</style>

<rect width="1280" height="460" fill="#FFFFFF"/>

<rect x="48" y="76" width="464" height="292" rx="24" fill="#FFFFFF" stroke="#DDE3E9" stroke-width="1"/>
<rect x="78" y="102" width="36" height="3.5" rx="1.8" fill="#B62E28" />
<text x="78" y="134" font-size="13" font-weight="700" fill="#8B949E" letter-spacing="1.5" class="s">区域 01</text>
<text x="78" y="166" font-size="23" font-weight="650" fill="#0D1117" class="s">在你的电脑上</text>
<line x1="78" y1="186" x2="482" y2="186" stroke="#DDE3E9" stroke-width="1" stroke-linecap="round" />
<circle cx="85" cy="214" r="3.4" fill="#B62E28" />
  <text x="100" y="220" font-size="18" font-weight="400" fill="#3D444D" class="s">记忆、文件和证据</text><circle cx="85" cy="248" r="3.4" fill="#B62E28" />
  <text x="100" y="254" font-size="18" font-weight="400" fill="#3D444D" class="s">原始上传件，原样保留</text><circle cx="85" cy="282" r="3.4" fill="#B62E28" />
  <text x="100" y="288" font-size="18" font-weight="400" fill="#3D444D" class="s">本机 WebUI · 127.0.0.1:8765</text><circle cx="85" cy="316" r="3.4" fill="#B62E28" />
  <text x="100" y="322" font-size="18" font-weight="400" fill="#3D444D" class="s">访问令牌与配对密钥</text>
<text x="78" y="352" font-size="16" font-weight="500" fill="#8B949E" class="s">只有你能读取。</text>

<rect x="578" y="76" width="228" height="292" rx="24" fill="#F6F8FA" stroke="#DDE3E9" stroke-width="1"/>
<rect x="606" y="102" width="36" height="3.5" rx="1.8" fill="#F0736A" />
<text x="606" y="134" font-size="13" font-weight="700" fill="#8B949E" letter-spacing="1.5" class="s">区域 02</text>
<text x="606" y="166" font-size="23" font-weight="650" fill="#0D1117" class="s">中转</text>
<line x1="606" y1="186" x2="778" y2="186" stroke="#DDE3E9" stroke-width="1" stroke-linecap="round" />
<text x="606" y="220" font-size="18" font-weight="400" fill="#3D444D" class="s">只经手密文</text>
<text x="606" y="264" font-size="16" font-weight="400" fill="#59636E" class="s">从不接触密钥。</text>
<text x="606" y="288" font-size="16" font-weight="400" fill="#59636E" class="s">无人取走的密文</text>
<text x="606" y="310" font-size="16" font-weight="400" fill="#59636E" class="s">7 天后自动删除。</text>


<rect x="872" y="76" width="356" height="292" rx="24" fill="#FFFFFF" stroke="#DDE3E9" stroke-width="1"/>
<rect x="902" y="102" width="36" height="3.5" rx="1.8" fill="#FF4B47" />
<text x="902" y="134" font-size="13" font-weight="700" fill="#8B949E" letter-spacing="1.5" class="s">区域 03</text>
<text x="902" y="166" font-size="23" font-weight="650" fill="#0D1117" class="s">你配置的端点</text>
<line x1="902" y1="186" x2="1198" y2="186" stroke="#DDE3E9" stroke-width="1" stroke-linecap="round" />
<circle cx="909" cy="214" r="3.4" fill="#FF4B47" />
  <text x="924" y="220" font-size="17" font-weight="400" fill="#3D444D" class="s">自建模型端点</text><circle cx="909" cy="248" r="3.4" fill="#FF4B47" />
  <text x="924" y="254" font-size="17" font-weight="400" fill="#3D444D" class="s">friend. 账号（若已登录）</text><circle cx="909" cy="282" r="3.4" fill="#FF4B47" />
  <text x="924" y="288" font-size="17" font-weight="400" fill="#3D444D" class="s">语音：经中转调用 FireRed</text>
<text x="902" y="352" font-size="16" font-weight="500" fill="#8B949E" class="s">只发送你选择的内容。</text>

<line x1="512" y1="214" x2="578" y2="214" stroke="#8B949E" stroke-width="1.6" stroke-dasharray="5 6" class="march"/>
<line x1="806" y1="214" x2="872" y2="214" stroke="#8B949E" stroke-width="1.6" stroke-dasharray="5 6" class="march"/>

<text x="640" y="406" font-size="19" font-weight="400" fill="#59636E" text-anchor="middle" class="s">friend.open-world.cn 无法读取你的记忆或本机访问令牌。</text>
</svg>
