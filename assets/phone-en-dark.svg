<text x="1136" y="234" font-size="17" font-weight="400" fill="#9DA9B7" text-anchor="middle" class="s">reviewable candidate</text>
<text x="640" y="292" font-size="18" font-weight="400" fill="#6F7B89" text-anchor="middle" class="s">Measured end to end: about 8 seconds from saving a recording to a transcribed memory.</text>
