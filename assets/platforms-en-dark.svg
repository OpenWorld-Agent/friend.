<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 330" width="1280" height="330" role="img" aria-label="Native packages for macOS Apple Silicon, Linux x86_64 and Windows x64, with their requirements.">
<defs>
  <radialGradient id="halo" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#FF7A70" stop-opacity=".55"/>
    <stop offset=".45" stop-color="#FF7A70" stop-opacity=".18"/>
    <stop offset="1" stop-color="#FF7A70" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2B323C"/>
    <stop offset="1" stop-color="#1B2129"/>
  </linearGradient>
  <linearGradient id="cardAltGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#39424F"/>
    <stop offset="1" stop-color="#262E38"/>
  </linearGradient>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="180%">
    <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="rgba(1,4,9,.62)" flood-opacity="1"/>
  </filter>
  <filter id="softSm" x="-30%" y="-30%" width="160%" height="180%">
    <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="rgba(1,4,9,.62)" flood-opacity=".8"/>
  </filter></defs>
<style>
  .s{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI Variable Display', 'Segoe UI', 'Helvetica Neue', Arial, 'Microsoft YaHei', 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', sans-serif}
  .m{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', 'Microsoft YaHei', monospace}
  .rise{opacity:0;animation:rise .9s cubic-bezier(.16,.84,.32,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(14px);filter:blur(6px)}to{opacity:1;transform:none;filter:blur(0)}}
  @keyframes breathe{0%,100%{opacity:.45;transform:scale(.96)}50%{opacity:.9;transform:scale(1.05)}}
  @keyframes breathe2{
    0%{opacity:.05;transform:scale(.93);animation-timing-function:cubic-bezier(.66,0,.34,1)}
    18%{opacity:.12;transform:scale(1.03);animation-timing-function:cubic-bezier(.37,0,.63,1)}
    34%{opacity:.07;transform:scale(.99);animation-timing-function:cubic-bezier(.45,0,.55,1)}
    57%{opacity:.15;transform:scale(1.085);animation-timing-function:cubic-bezier(.3,0,.7,1)}
    72%{opacity:.088;transform:scale(1.008);animation-timing-function:cubic-bezier(.6,0,.4,1)}
    88%{opacity:.126;transform:scale(1.052);animation-timing-function:cubic-bezier(.5,0,.5,1)}
    100%{opacity:.05;transform:scale(.93)}
  }
  @keyframes twinkle{0%,100%{opacity:.12}50%{opacity:.5}}
  .tw{animation:twinkle 9s ease-in-out infinite}
  .snr{animation:snr 5.4s cubic-bezier(.16,.84,.32,1) infinite;transform-box:fill-box;transform-origin:center}
  @keyframes snr{0%{transform:scale(.5);opacity:.55}65%{opacity:0}100%{transform:scale(1.6);opacity:0}}
  .swp{animation-timing-function:cubic-bezier(.83,0,.17,1);animation-iteration-count:infinite;opacity:0}
  .march{animation:march 1.65s linear infinite}
  .dp{animation:dotpulse 2.6s ease-in-out infinite}
  @keyframes dotpulse{0%,100%{opacity:.42}50%{opacity:1}}
  @keyframes march{to{stroke-dashoffset:-24}}
  .scan{animation:scan 4s cubic-bezier(.83,0,.17,1) infinite;opacity:0}
  @keyframes scan{0%{transform:translateX(0);opacity:0}8%{opacity:1}88%{opacity:1}100%{transform:translateX(1140px);opacity:0}}
  @media (prefers-reduced-motion: reduce){
    .rise{animation:none!important;opacity:1!important;filter:none!important;transform:none!important}
    .tw{animation:none!important;opacity:.55!important}
    .snr,.swp,.scan{animation:none!important;opacity:0!important}
    .march{animation:none!important}
    .dp{animation:none!important;opacity:1!important}
  }@keyframes swp{0%{transform:translateX(0);opacity:0}18%{opacity:1}82%{opacity:1}100%{transform:translateX(287.33px);opacity:0}}</style>

<rect width="1280" height="330" fill="#0D1117"/>
<g filter="url(#softSm)"><rect x="40" y="44" width="385.33" height="234" rx="20" fill="url(#cardGrad)" stroke="#3E4855" stroke-width="1"/></g>
<g transform="translate(75 84)" opacity=".9"><g fill="none" stroke="#88B4E0" stroke-width="1.7" stroke-linecap="round">
    <rect x="-10.08" y="-7.92" width="20.16" height="15.84" rx="2.4000000000000004"/>
    <path d="M-10.08 -2.16 h20.16"/></g></g>
<text x="92" y="94" font-size="21" font-weight="600" fill="#F5F8FB" class="s">macOS</text>
<text x="92" y="120" font-size="16" font-weight="400" fill="#6F7B89" class="s">Apple Silicon</text>
<rect x="64" y="138" width="337.33" height="46" rx="10" fill="#141A21" />
<text x="78" y="158" font-size="14" font-weight="400" fill="#D2DBE5" class="m">openworld-memory-v0.1.8-</text><text x="78" y="176" font-size="14" font-weight="400" fill="#D2DBE5" class="m">macos-arm64.tar.gz</text>
<text x="64" y="208" font-size="16" font-weight="400" fill="#9DA9B7" class="s">Requires</text>
<text x="64" y="230" font-size="16" font-weight="400" fill="#9DA9B7" class="s">macOS 14 or later</text><g filter="url(#softSm)"><rect x="447.33" y="44" width="385.33" height="234" rx="20" fill="url(#cardGrad)" stroke="#3E4855" stroke-width="1"/></g>
<g transform="translate(482.3333333333333 84)" opacity=".9"><g fill="none" stroke="#8FBE9E" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-7.199999999999999 -5.28 l5.04 5.28 l-5.04 5.28"/>
    <path d="M0.96 5.76 h6.24"/></g></g>
<text x="499.33" y="94" font-size="21" font-weight="600" fill="#F5F8FB" class="s">Linux</text>
<text x="499.33" y="120" font-size="16" font-weight="400" fill="#6F7B89" class="s">x86_64</text>
<rect x="471.33" y="138" width="337.33" height="46" rx="10" fill="#141A21" />
<text x="485.33" y="158" font-size="14" font-weight="400" fill="#D2DBE5" class="m">openworld-memory-v0.1.8-</text><text x="485.33" y="176" font-size="14" font-weight="400" fill="#D2DBE5" class="m">linux-x86_64.tar.gz</text>
<text x="471.33" y="208" font-size="16" font-weight="400" fill="#9DA9B7" class="s">Requires</text>
<text x="471.33" y="230" font-size="16" font-weight="400" fill="#9DA9B7" class="s">glibc 2.35 or later (for example, Ubuntu</text><text x="471.33" y="252" font-size="16" font-weight="400" fill="#9DA9B7" class="s">22.04+)</text><g filter="url(#softSm)"><rect x="854.67" y="44" width="385.33" height="234" rx="20" fill="url(#cardGrad)" stroke="#3E4855" stroke-width="1"/></g>
<g transform="translate(889.6666666666666 84)" opacity=".9"><g fill="none" stroke="#B49BE0" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-8.64 -11.52 h11.52 l6.24 6.24 v16.799999999999997 h-17.759999999999998 z"/>
    <path d="M-3.12 -2.88 h7.199999999999999 M-3.12 1.92 h7.199999999999999"/></g></g>
<text x="906.67" y="94" font-size="21" font-weight="600" fill="#F5F8FB" class="s">Windows</text>
<text x="906.67" y="120" font-size="16" font-weight="400" fill="#6F7B89" class="s">x64</text>
<rect x="878.67" y="138" width="337.33" height="46" rx="10" fill="#141A21" />
<text x="892.67" y="158" font-size="14" font-weight="400" fill="#D2DBE5" class="m">openworld-memory-v0.1.8-</text><text x="892.67" y="176" font-size="14" font-weight="400" fill="#D2DBE5" class="m">windows-x86_64.zip</text>
<text x="878.67" y="208" font-size="16" font-weight="400" fill="#9DA9B7" class="s">Requires</text>
<text x="878.67" y="230" font-size="16" font-weight="400" fill="#9DA9B7" class="s">Windows 10/11</text>
<text x="640" y="318" font-size="17" font-weight="400" fill="#6F7B89" text-anchor="middle" class="s">The installer needs Python 3.9+; each native executable carries its own runtime.</text>
</svg>
