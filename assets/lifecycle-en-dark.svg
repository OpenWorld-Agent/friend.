<g filter="url(#softSm)">
  <rect x="40" y="66" width="310" height="212" rx="20" fill="url(#cardGrad)" stroke="#3E4855" stroke-width="1"/>
  <g transform="translate(66 100)"><g fill="none" stroke="#FF6B63" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-6.6 -4.84 l4.62 4.84 l-4.62 4.84"/>
    <path d="M0.88 5.279999999999999 h5.720000000000001"/></g></g>
  <text x="96" y="108" font-size="20" font-weight="600" fill="#F5F8FB" class="s">Codex</text>
  <line x1="62" y1="128" x2="328" y2="128" stroke="#3E4855" stroke-width="1" stroke-linecap="round" />
  <rect x="62" y="144" width="266" height="72" rx="12" fill="#141A21" />
  <text x="80" y="174" font-size="18" font-weight="400" fill="#D2DBE5" class="s">“We moved to Lisbon</text>
  <text x="80" y="198" font-size="18" font-weight="400" fill="#D2DBE5" class="s">in March.”</text>
  <text x="64" y="250" font-size="16" font-weight="400" fill="#6F7B89" class="s">a durable fact, told once</text>
</g>

<g filter="url(#softSm)">
  <rect x="462" y="66" width="356" height="212" rx="20" fill="url(#cardGrad)" stroke="#3E4855" stroke-width="1"/>
  <g transform="translate(508 102)"><g transform="scale(0.13)">
  <path fill="#FF6B63" d="M10,-99.499A100 100 0 0 1 99.499,-10L58.146,-10A59 59 0 0 0 10,-58.146Z"/>
  <path fill="#F5F8FB" d="M99.499,10A100 100 0 0 1 10,99.499L10,58.146A59 59 0 0 0 58.146,10Z"/>
  <path fill="#F5F8FB" d="M-10,99.499A100 100 0 0 1 -99.499,10L-58.146,10A59 59 0 0 0 -10,58.146Z"/>
  <path fill="#F5F8FB" d="M-99.499,-10A100 100 0 0 1 -10,-99.499L-10,-58.146A59 59 0 0 0 -58.146,-10Z"/></g></g>
  <text x="528" y="110" font-size="21" font-weight="650" fill="#F5F8FB" class="s">friend. Memory</text>
  <line x1="484" y1="128" x2="796" y2="128" stroke="#3E4855" stroke-width="1" stroke-linecap="round" />
  <rect x="484" y="144" width="312" height="54" rx="12" fill="#3C1C18" />
  <circle cx="506" cy="171" r="4" fill="#FF6B63" />
  <text x="522" y="178" font-size="17" font-weight="600" fill="#FF6B63" class="m">lives_in: Lisbon</text>
  <text x="484" y="224" font-size="16" font-weight="400" fill="#9DA9B7" class="s">Pending until you review it.</text>
  <text x="484" y="246" font-size="16" font-weight="400" fill="#9DA9B7" class="s">Editable and deletable.</text>
</g>

