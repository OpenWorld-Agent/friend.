</g><g>
  <animateMotion dur="1.25s" begin="-0.62s" repeatCount="indefinite" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines=".42 0 .28 1"><mpath href="#lc1"/></animateMotion>
  <circle r="6.300000000000001" fill="#FF6B63" opacity="0"><animate attributeName="r" values="2.52;6.300000000000001;6.300000000000001;2.52" keyTimes="0;.14;.86;1" calcMode="spline" keySplines=".4 0 .6 1;.4 0 .6 1;.4 0 .6 1" dur="1.25s" begin="-0.62s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.115;.115;0" keyTimes="0;.14;.86;1" calcMode="spline" keySplines=".4 0 .6 1;.4 0 .6 1;.4 0 .6 1" dur="1.25s" begin="-0.62s" repeatCount="indefinite"/></circle>
  <circle r="4.2" fill="#FF6B63" opacity="0"><animate attributeName="r" values="1.47;4.2;4.2;1.47" keyTimes="0;.14;.86;1" calcMode="spline" keySplines=".4 0 .6 1;.4 0 .6 1;.4 0 .6 1" dur="1.25s" begin="-0.62s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.14;.86;1" calcMode="spline" keySplines=".4 0 .6 1;.4 0 .6 1;.4 0 .6 1" dur="1.25s" begin="-0.62s" repeatCount="indefinite"/></circle>
</g>
<g>
  <animateMotion dur="1.4s" begin="-0.29s" repeatCount="indefinite" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines=".42 0 .28 1"><mpath href="#lc2"/></animateMotion>
  <circle r="6.300000000000001" fill="#FF6B63" opacity="0"><animate attributeName="r" values="2.52;6.300000000000001;6.300000000000001;2.52" keyTimes="0;.14;.86;1" calcMode="spline" keySplines=".4 0 .6 1;.4 0 .6 1;.4 0 .6 1" dur="1.4s" begin="-0.29s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.115;.115;0" keyTimes="0;.14;.86;1" calcMode="spline" keySplines=".4 0 .6 1;.4 0 .6 1;.4 0 .6 1" dur="1.4s" begin="-0.29s" repeatCount="indefinite"/></circle>
  <circle r="4.2" fill="#FF6B63" opacity="0"><animate attributeName="r" values="1.47;4.2;4.2;1.47" keyTimes="0;.14;.86;1" calcMode="spline" keySplines=".4 0 .6 1;.4 0 .6 1;.4 0 .6 1" dur="1.4s" begin="-0.29s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.14;.86;1" calcMode="spline" keySplines=".4 0 .6 1;.4 0 .6 1;.4 0 .6 1" dur="1.4s" begin="-0.29s" repeatCount="indefinite"/></circle>
</g><g>
  <animateMotion dur="1.4s" begin="-0.98s" repeatCount="indefinite" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines=".42 0 .28 1"><mpath href="#lc2"/></animateMotion>
  <circle r="6.300000000000001" fill="#FF6B63" opacity="0"><animate attributeName="r" values="2.52;6.300000000000001;6.300000000000001;2.52" keyTimes="0;.14;.86;1" calcMode="spline" keySplines=".4 0 .6 1;.4 0 .6 1;.4 0 .6 1" dur="1.4s" begin="-0.98s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.115;.115;0" keyTimes="0;.14;.86;1" calcMode="spline" keySplines=".4 0 .6 1;.4 0 .6 1;.4 0 .6 1" dur="1.4s" begin="-0.98s" repeatCount="indefinite"/></circle>
  <circle r="4.2" fill="#FF6B63" opacity="0"><animate attributeName="r" values="1.47;4.2;4.2;1.47" keyTimes="0;.14;.86;1" calcMode="spline" keySplines=".4 0 .6 1;.4 0 .6 1;.4 0 .6 1" dur="1.4s" begin="-0.98s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.14;.86;1" calcMode="spline" keySplines=".4 0 .6 1;.4 0 .6 1;.4 0 .6 1" dur="1.4s" begin="-0.98s" repeatCount="indefinite"/></circle>
